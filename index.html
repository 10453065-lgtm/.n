<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huawei Pura 80 Ultra 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #header-title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 18px;
            letter-spacing: 2px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
        #header-title span {
            color: #d4af37;
        }
        #info-panel {
            position: absolute;
            bottom: 30px;
            left: 20px;
            color: #fff;
            background: rgba(15, 15, 15, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            pointer-events: none;
            z-index: 10;
        }
        p { margin: 4px 0; font-size: 12px; color: #aaa; }
        .stat { color: #d4af37; font-weight: bold; }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }
    </style>
</head>
<body>

    <div id="header-title">HUAWEI <span>PURA 80 ULTRA</span> - Concepto 3D Interactivo</div>

    <div id="info-panel">
        <p>Color: <span class="stat">Prestige Gold</span></p>
        <p>Dimensiones: <span class="stat">163 x 76.1 x 8.3 mm</span></p>
        <p style="margin-top: 10px; font-size: 10px; color: #666;">Arrastra para rotar · Scroll para zoom</p>
    </div>

    <div id="canvas-container"></div>

    <!-- Cargamos Three.js de forma totalmente compatible mediante ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com",
          "three/addons/": "https://unpkg.com"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 30, 280);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 120;
        controls.maxDistance = 450;

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xfff3db, 2.0);
        keyLight.position.set(100, 150, 150);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
        fillLight.position.set(-100, -50, 100);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
        rimLight.position.set(0, 100, -150);
        scene.add(rimLight);

        // Modelo del Teléfono (Proporciones GSMArena)
        const width = 76.1;
        const height = 163.0;
        const depth = 8.3;
        const radius = 9.0;

        const phoneGroup = new THREE.Group();

        const goldMaterial = new THREE.MeshStandardMaterial({
            color: 0xe3c598,
            metalness: 0.85,
            roughness: 0.18
        });

        const screenMaterial = new THREE.MeshStandardMaterial({
            color: 0x0a0a0a,
            metalness: 0.2,
            roughness: 0.04
        });

        const shape = new THREE.Shape();
        shape.moveTo(-width/2 + radius, -height/2);
        shape.lineTo(width/2 - radius, -height/2);
        shape.quadraticCurveTo(width/2, -height/2, width/2, -height/2 + radius);
        shape.lineTo(width/2, height/2 - radius);
        shape.quadraticCurveTo(width/2, height/2, width/2 - radius, height/2);
        shape.lineTo(-width/2 + radius, height/2);
        shape.quadraticCurveTo(-width/2, height/2, -width/2, height/2 - radius);
        shape.lineTo(-width/2, -height/2 + radius);
        shape.quadraticCurveTo(-width/2, -height/2, -width/2 + radius, -height/2);

        const extrudeSettings = { steps: 1, depth: depth - 2, bevelEnabled: true, bevelThickness: 1, bevelSize: 1, bevelSegments: 5 };
        const bodyGeometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        bodyGeometry.center();
        const phoneBody = new THREE.Mesh(bodyGeometry, goldMaterial);
        phoneGroup.add(phoneBody);

        const screenGeometry = new THREE.PlaneGeometry(width - 1.5, height - 1.5);
        const phoneScreen = new THREE.Mesh(screenGeometry, screenMaterial);
        phoneScreen.position.z = (depth / 2) + 0.02;
        phoneGroup.add(phoneScreen);

        // Módulo de cámara icónico de la serie Pura
        const cameraModuleGroup = new THREE.Group();
        const camShape = new THREE.Shape();
        camShape.moveTo(-15, -20);
        camShape.lineTo(15, -24);
        camShape.lineTo(20, 20);
        camShape.lineTo(-11, 24);
        camShape.closePath();

        const camGeometry = new THREE.ExtrudeGeometry(camShape, { steps: 1, depth: 2.5, bevelEnabled: true, bevelThickness: 0.4, bevelSize: 0.4, bevelSegments: 4 });
        const camIsland = new THREE.Mesh(camGeometry, goldMaterial);
        cameraModuleGroup.add(camIsland);

        // Lentes
        const lenses = [{x: 4, y: 10, r: 7}, {x: -4, y: -8, r: 5}, {x: 10, y: -10, r: 4}];
        lenses.forEach(lens => {
            const ringGeom = new THREE.CylinderGeometry(lens.r, lens.r - 0.5, 0.6, 32);
            const ring = new THREE.Mesh(ringGeom, goldMaterial);
            ring.rotation.x = Math.PI / 2;
            ring.position.set(lens.x, lens.y, 2.6);
            cameraModuleGroup.add(ring);

            const glassGeom = new THREE.CylinderGeometry(lens.r - 0.5, lens.r - 0.5, 0.4, 32);
            const glass = new THREE.Mesh(glassGeom, new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.9, roughness: 0.05}));
            glass.rotation.x = Math.PI / 2;
            glass.position.set(lens.x, lens.y, 2.7);
            cameraModuleGroup.add(glass);
        });

        cameraModuleGroup.position.set(-13, 44, -(depth / 2) - 0.05);
        cameraModuleGroup.rotation.y = Math.PI;
        phoneGroup.add(cameraModuleGroup);

        scene.add(phoneGroup);

        phoneGroup.rotation.y = 0.5;
        phoneGroup.rotation.x = 0.1;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
